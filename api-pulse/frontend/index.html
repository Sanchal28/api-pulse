<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>API Pulse — Sign in</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-shell">
    <div class="auth-card">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M2 12h4l2-7 4 14 3-10 2 3h5" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>API Pulse</span>
      </div>

      <h1 id="formTitle">Sign in to your account</h1>
      <p class="sub" id="formSub">Monitor incoming and outgoing traffic in real time.</p>

      <form id="authForm">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" minlength="6" />

        <div class="error-box" id="errorBox"></div>

        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="switch-line">
        <span id="switchText">Don't have an account?</span>
        <a href="#" id="switchLink">Create one</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
